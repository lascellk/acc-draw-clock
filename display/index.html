<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ACC Draw Clock</title>
  <style>
    /* Club colours from the logo. Warning stays bright yellow so it reads across the rink. */
    :root { --bg: #0f1e3d; --fg: #ede6d3; --muted: rgba(237, 230, 211, .6); --gold: #c4a35f; }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body {
      background: var(--bg); color: var(--fg); cursor: none;
      font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: background-color .6s, color .6s;
    }
    body.pre  { --bg: #1e3364; }
    body.warn { --bg: #f5c400; --fg: #111; --muted: rgba(0, 0, 0, .65); }
    body.over { --bg: #b3222f; --fg: #fff; --muted: rgba(255, 255, 255, .75); }
    body.run #label, body.pre #label { color: var(--gold); }

    #logo  { display: none; height: 50vh; margin-bottom: 4vh; }
    body.idle.has-logo #logo { display: block; }
    body.has-logo #label, body.has-logo #sub { display: none; }
    #label { font-size: 7vh; font-weight: 600; min-height: 9vh; text-align: center; }
    #clock { font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; white-space: nowrap; }
    #sub   { font-size: 6vh; min-height: 8vh; color: var(--muted); text-align: center; }

    body.idle #clock { color: var(--muted); }
    body.paused #clock { opacity: .4; }
    body.over #clock { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: .35; } }

    #status { position: fixed; right: 2vw; bottom: 1.5vh; font-size: 2.4vh; color: var(--muted); }
    #sound-gate {
      position: fixed; top: 0; left: 0; right: 0; padding: 2vh; text-align: center;
      font-size: 3vh; background: rgba(0, 0, 0, .8); color: #fff; cursor: pointer;
    }
  </style>
</head>
<body class="idle">
  <img id="logo" src="assets/logo.png" alt="Almonte Curling Club">
  <div id="label"></div>
  <div id="clock">--:--</div>
  <div id="sub"></div>
  <div id="status"></div>
  <div id="sound-gate" hidden>Sound is blocked — click anywhere to enable it</div>

  <script src="config.js"></script>
  <script src="display.js"></script>
</body>
</html>
