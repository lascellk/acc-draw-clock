<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="theme-color" content="#1e3364">
  <title>ACC Draw Clock</title>
  <link rel="icon" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">
  <style>
    /* Club colours, taken from the logo */
    :root {
      --navy: #1e3364; --navy-deep: #0f1e3d; --red: #b3222f; --gold: #c4a35f;
      --cream: #ede6d3; --charcoal: #2f2d2b;
      --bg: #f6f2e8; --card: #fff; --fg: var(--charcoal); --muted: #6b6559;
      --accent: var(--navy); --danger: var(--red); --warn: #f5c400;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0 16px 40px; background: var(--bg); color: var(--fg);
      font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    main { max-width: 560px; margin: 0 auto; }
    header {
      display: flex; align-items: center; gap: 12px; margin: 0 -16px 14px; padding: 10px 16px;
      background: var(--navy); color: var(--cream); border-bottom: 4px solid var(--gold);
    }
    header .inner { display: flex; align-items: center; gap: 12px; max-width: 560px; margin: 0 auto; width: 100%; }
    header img { width: 56px; height: 56px; flex: none; }
    header h1 { font-size: 21px; margin: 0; line-height: 1.15; }
    header h1 small { display: block; font-size: 13px; font-weight: 500; color: var(--gold); letter-spacing: .06em; text-transform: uppercase; }
    h2 { font-size: 14px; margin: 0 0 10px; color: var(--navy); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
    .card { background: var(--card); border-radius: 14px; padding: 14px; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(30,51,100,.12); }

    #now { text-align: center; background: var(--navy-deep); color: var(--cream); transition: background-color .4s, color .4s; }
    #now.pre { background: var(--navy); }
    #now.warn { background: var(--warn); color: #111; }
    #now.over { background: var(--danger); color: #fff; }
    #nowLabel { font-size: 18px; font-weight: 600; min-height: 22px; }
    #nowClock { font-size: 64px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
    #nowSub { font-size: 15px; min-height: 18px; opacity: .75; }

    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    button {
      font: inherit; font-size: 18px; font-weight: 600; padding: 18px 10px; border-radius: 12px;
      border: 0; background: var(--cream); color: var(--navy); cursor: pointer;
    }
    button:active { transform: scale(.98); }
    button:disabled { opacity: .4; }
    button.preset { background: var(--accent); color: #fff; border-bottom: 3px solid var(--gold); }
    button.preset small { display: block; font-weight: 400; font-size: 14px; color: var(--cream); opacity: .85; }
    button.danger { background: var(--danger); color: #fff; }
    .full { grid-column: 1 / -1; }

    .seg { display: flex; gap: 6px; margin-bottom: 12px; }
    .seg button { flex: 1; padding: 10px 4px; font-size: 15px; }
    .seg button.on { background: var(--gold); color: var(--navy-deep); }

    #pinRow label { display: flex; align-items: center; gap: 10px; font-weight: 600; color: var(--navy); }
    #pin { flex: 1; font-size: 20px; padding: 10px; border: 1px solid var(--gold); border-radius: 10px; }

    .toggle { display: flex; align-items: center; gap: 14px; font-size: 18px; font-weight: 600; color: var(--navy); cursor: pointer; }
    .toggle input { width: 28px; height: 28px; margin: 0; flex: none; accent-color: var(--navy); }
    .toggle small { display: block; font-size: 13px; font-weight: 400; color: var(--muted); }

    #toast {
      position: fixed; left: 16px; right: 16px; bottom: 16px; padding: 12px; border-radius: 10px;
      background: var(--navy-deep); color: var(--cream); text-align: center; opacity: 0; transition: opacity .3s; pointer-events: none;
      max-width: 528px; margin: 0 auto;
    }
    #toast.show { opacity: 1; }
    #toast.err { background: var(--danger); }
    body.busy button { pointer-events: none; opacity: .6; }
  </style>
</head>
<body>
  <header>
    <div class="inner">
      <img src="logo.png" alt="Almonte Curling Club">
      <h1><small>Almonte Curling Club</small>Draw Clock</h1>
    </div>
  </header>

  <main>
    <section id="now" class="card">
      <div id="nowLabel"></div>
      <div id="nowClock">--:--</div>
      <div id="nowSub">Loading…</div>
    </section>

    <section id="pinRow" class="card" hidden>
      <label>PIN <input id="pin" type="password" inputmode="numeric" autocomplete="off"></label>
    </section>

    <section class="card">
      <h2>Start a draw</h2>
      <div class="seg" id="delay">
        <button data-min="0" class="on">Now</button>
        <button data-min="5">In 5</button>
        <button data-min="10">In 10</button>
        <button data-min="15">In 15</button>
      </div>
      <div id="presets" class="grid"></div>
    </section>

    <section class="card">
      <h2>Running draw</h2>
      <div class="grid">
        <button id="pauseBtn" class="full">Pause</button>
        <button data-adj="-1">−1 min</button>
        <button data-adj="1">+1 min</button>
        <button id="stopBtn" class="danger full">Stop</button>
      </div>
    </section>

    <section class="card">
      <label class="toggle">
        <input type="checkbox" id="buzzer" checked>
        <span>Buzzer<small>Start, warning and time-up sounds on the TV</small></span>
      </label>
    </section>
  </main>

  <div id="toast"></div>

<script>
  // Apps Script web app (ends in /exec). The same URL the TV display reads.
  const API_URL = 'https://script.google.com/macros/s/AKfycbwU_wM84nwdgzD-wbVRGAq7vwXXuVEgfHiOFh1I4ZcPjYek5JcBRp7nkUwduYVeRo8T/exec';

  const $ = id => document.getElementById(id);
  const pinEl = $('pin');
  let pinRequired = false;
  let state = null;
  let offsetMs = 0;
  let delayMin = 0;

  // ---- server calls (plain fetch, no Google sign-in involved)
  async function getJson(mode) {
    const res = await fetch(API_URL + '?mode=' + mode + '&_=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('Server error ' + res.status);
    return res.json();
  }

  async function post(body) {
    // text/plain keeps this a "simple" request, so there's no CORS preflight.
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(body),
    });
    if (!res.ok) throw new Error('Server error ' + res.status);
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'Something went wrong');
    return data.state;
  }

  // ---- setup
  async function init() {
    try {
      const cfg = await getJson('config');
      pinRequired = cfg.pinRequired;
      buildPresets(cfg.presets);
    } catch (err) {
      toast("Can't reach the clock server — check your connection", true);
      setTimeout(init, 5000);
      return;
    }
    if (pinRequired) {
      $('pinRow').hidden = false;
      try { pinEl.value = localStorage.getItem('accPin') || ''; } catch (e) {}
    }
    refresh();
    setInterval(refresh, 5000);
    setInterval(render, 250);
  }

  function buildPresets(presets) {
    presets.forEach(p => {
      const b = document.createElement('button');
      b.className = 'preset';
      b.textContent = p.label;
      const small = document.createElement('small');
      small.textContent = p.minutes + ' min';
      b.appendChild(small);
      b.onclick = () => startPreset(p);
      $('presets').appendChild(b);
    });
  }

  document.querySelectorAll('#delay button').forEach(b => {
    b.onclick = () => {
      delayMin = Number(b.dataset.min);
      document.querySelectorAll('#delay button').forEach(x => x.classList.toggle('on', x === b));
    };
  });

  document.querySelectorAll('[data-adj]').forEach(b => {
    b.onclick = () => send('adjust', { minutes: Number(b.dataset.adj) });
  });

  $('pauseBtn').onclick = () => send(state && state.status === 'paused' ? 'resume' : 'pause');
  $('stopBtn').onclick = () => {
    if (confirm('Stop the clock?')) send('stop');
  };

  // While a change is in flight, don't let polling flip the box back.
  let buzzerPending = false;
  $('buzzer').onchange = e => {
    buzzerPending = true;
    send('buzzer', { on: e.target.checked }).finally(() => { buzzerPending = false; render(); });
  };

  // ---- actions
  function startPreset(p) {
    if (state && state.status !== 'idle' &&
        !confirm('A draw is already on the clock. Replace it with "' + p.label + '"?')) return;
    send('start', { presetId: p.id, delayMin: delayMin });
  }

  async function send(cmd, arg) {
    const pin = pinEl.value.trim();
    if (pinRequired) {
      if (!pin) { toast('Enter the club PIN first', true); pinEl.focus(); return; }
      try { localStorage.setItem('accPin', pin); } catch (e) {}
    }
    document.body.classList.add('busy');
    try {
      setState(await post({ pin: pin, cmd: cmd, arg: arg || {} }));
      toast('Done');
    } catch (err) {
      toast(err.message, true);
    } finally {
      document.body.classList.remove('busy');
    }
  }

  async function refresh() {
    try { setState(await getJson('state')); } catch (err) { /* keep counting from last state */ }
  }

  function setState(s) {
    state = s;
    offsetMs = s.serverNow - Date.now();
    render();
  }

  // ---- view (same rules as the display)
  function fmt(ms) {
    const total = Math.max(0, Math.ceil(ms / 1000));
    const m = Math.floor(total / 60), s = total % 60;
    return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  }

  function render() {
    if (!state) return;
    const now = Date.now() + offsetMs;
    const s = state;
    let cls = '', clock = '--:--', sub = '';

    if (s.status === 'idle') {
      sub = 'No draw on the clock';
    } else if (s.status === 'paused') {
      const pre = s.startDelayMsWhenPaused > 0;
      clock = fmt(pre ? s.startDelayMsWhenPaused : s.remainingMsWhenPaused);
      sub = pre ? 'Paused (before start)' : 'Paused';
      cls = pre ? 'pre' : (s.remainingMsWhenPaused <= s.warningMin * 60000 ? 'warn' : '');
    } else if (now < s.startsAt) {
      clock = fmt(s.startsAt - now); sub = 'Starts in'; cls = 'pre';
    } else if (s.endsAt - now <= 0) {
      clock = '00:00'; sub = "Time's up · +" + fmt(now - s.endsAt).replace(/^0/, ''); cls = 'over';
    } else {
      const ms = s.endsAt - now;
      clock = fmt(ms);
      if (ms <= s.warningMin * 60000) { cls = 'warn'; sub = 'Warning'; }
      else sub = 'Ends ' + new Date(s.endsAt).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    }

    $('now').className = 'card ' + cls;
    $('nowLabel').textContent = s.label || '';
    $('nowClock').textContent = clock;
    $('nowSub').textContent = sub;

    const live = s.status !== 'idle';
    $('pauseBtn').disabled = !live;
    $('pauseBtn').textContent = s.status === 'paused' ? 'Resume' : 'Pause';
    $('stopBtn').disabled = !live;
    document.querySelectorAll('[data-adj]').forEach(b => { b.disabled = !live; });
    if (!buzzerPending) $('buzzer').checked = s.buzzer !== false;
  }

  let toastTimer;
  function toast(msg, isErr) {
    const t = $('toast');
    t.textContent = msg;
    t.className = 'show' + (isErr ? ' err' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.className = ''; }, isErr ? 3500 : 1200);
  }

  init();
</script>
</body>
</html>
